<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>S-01 — ระบบบริการขอใช้อาคารสถานกีฬา — Wireframe v2.18</title>
<style>
:root {
  --gd: #1B4332; --gm: #2D6A4F; --gl: #52B788; --gp: #D8F3DC;
  --go: #C9A84C; --gol: #F0D080; --gop: #FDF6E3;
  --w: #fff; --g50: #F9F9F9; --g100: #F4F4F4; --g200: #E0E0E0;
  --g400: #9E9E9E; --g600: #616161; --g700: #424242; --td: #1A2E1A;
  --r: 8px; --sh: 0 2px 10px rgba(0,0,0,0.10);
}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Tahoma','Segoe UI',sans-serif;background:#EAEEEB;color:var(--td);font-size:13px;line-height:1.55;}
.pw{width:1320px;margin:0 auto;padding:28px 24px 48px;}

/* DOC HEADER */
.dh{background:var(--gd);border-radius:12px;padding:20px 28px;margin-bottom:10px;display:flex;align-items:flex-start;justify-content:space-between;}
.dh h1{font-size:18px;font-weight:700;color:var(--gol);line-height:1.4;}
.dh .sub{font-size:11px;color:rgba(255,255,255,0.65);margin-top:4px;}
.tor{background:var(--go);color:var(--gd);border-radius:20px;padding:4px 14px;font-size:11px;font-weight:700;white-space:nowrap;align-self:flex-start;}

/* SECTION */
.sh{display:flex;align-items:center;gap:10px;margin:28px 0 14px;flex-wrap:wrap;}
.sp{background:var(--gd);color:var(--gol);padding:3px 14px;border-radius:20px;font-size:12px;font-weight:700;}
.st{font-size:15px;font-weight:700;color:var(--gd);}
.tr{font-size:11px;color:var(--go);font-weight:700;}

/* GRIDS */
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;}
.g2{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;}

/* SCREEN CARD */
.sc{background:var(--w);border-radius:var(--r);box-shadow:var(--sh);overflow:hidden;border:1px solid var(--g200);}
.sl{background:var(--g100);border-bottom:1px solid var(--g200);padding:5px 10px;font-size:10px;font-weight:700;color:var(--g700);display:flex;justify-content:space-between;align-items:center;}
.sn{color:var(--go);font-weight:700;}

/* TOPBAR */
.tb{background:var(--gd);display:flex;align-items:center;justify-content:space-between;padding:0 14px;height:36px;}
.tb .logo{font-weight:700;font-size:12px;color:var(--gol);}
.tb .ni{display:flex;gap:10px;}
.tb .ni a{font-size:10px;color:rgba(255,255,255,0.7);text-decoration:none;}
.tb .ni a.act{color:var(--gol);border-bottom:1.5px solid var(--go);}
.tb .ub{background:var(--go);color:var(--gd);border-radius:20px;padding:2px 8px;font-size:10px;font-weight:700;}

/* SIDEBAR */
.ls{display:flex;min-height:300px;}
.sb{width:130px;background:var(--gp);flex-shrink:0;padding:10px 0;border-right:1px solid var(--g200);}
.sbi{padding:7px 12px;font-size:10px;color:var(--gd);cursor:pointer;display:flex;align-items:center;gap:6px;}
.sbi.act{background:var(--gd);color:var(--gol);font-weight:600;}
.sbd{width:5px;height:5px;border-radius:50%;background:currentColor;flex-shrink:0;}
.sbg{font-size:9px;color:var(--g400);padding:8px 12px 3px;text-transform:uppercase;letter-spacing:0.5px;}
.ct{flex:1;padding:12px 14px;overflow:hidden;}

/* FORM */
.fg{margin-bottom:8px;}
.fl{font-size:9px;color:var(--g700);margin-bottom:3px;font-weight:700;display:block;}
.fl .req{color:#C0392B;}
.fi{width:100%;border:1px solid var(--g200);border-radius:5px;height:26px;background:var(--w);padding:0 8px;font-size:10px;color:var(--g400);font-family:inherit;}
.fi.f{border-color:var(--gm);color:var(--td);}
.fi.pf{background:var(--gp);border-color:var(--gl);color:var(--td);}
.fsel{width:100%;border:1px solid var(--g200);border-radius:5px;height:26px;background:var(--w);padding:0 8px;font-size:10px;color:var(--g400);font-family:inherit;}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.fr3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
.fta{width:100%;border:1px solid var(--g200);border-radius:5px;background:var(--w);padding:6px 8px;font-size:10px;color:var(--g400);font-family:inherit;min-height:52px;resize:none;}

/* INNER CARD */
.ic{background:var(--g100);border:1px solid var(--g200);border-radius:7px;padding:8px 10px;margin-bottom:8px;}
.it{font-size:10px;font-weight:700;color:var(--gd);margin-bottom:6px;padding-bottom:4px;border-bottom:1.5px solid var(--go);display:flex;align-items:center;gap:5px;}
.itd{width:6px;height:6px;border-radius:50%;background:var(--go);flex-shrink:0;}

/* BUTTONS */
.gb{background:var(--go);color:var(--gd);border:none;border-radius:5px;padding:5px 12px;font-size:10px;font-weight:700;cursor:pointer;font-family:inherit;}
.gbf{width:100%;height:30px;font-size:11px;}
.ob{background:var(--w);border:1px solid var(--gm);color:var(--gm);border-radius:5px;padding:4px 10px;font-size:10px;cursor:pointer;font-family:inherit;}
.grb{background:var(--gm);color:var(--w);border:none;border-radius:5px;padding:5px 12px;font-size:10px;font-weight:700;cursor:pointer;font-family:inherit;}
.bsm{padding:2px 8px;font-size:9px;}

/* BADGE */
.bd{display:inline-block;padding:2px 8px;border-radius:10px;font-size:8px;font-weight:700;}
.bg{background:var(--gp);color:var(--gd);}
.bo{background:var(--gop);color:#7B6010;border:1px solid var(--go);}
.bgy{background:var(--g200);color:var(--g600);}
.br{background:#FFEBEE;color:#B71C1C;}
.bb{background:#E3F2FD;color:#1565C0;}
.bor{background:#FFF8E1;color:#E65100;}
.bpu{background:#EDE7F6;color:#512DA8;}

/* NOTICE */
.no{border-radius:5px;padding:6px 9px;font-size:9px;margin-bottom:7px;}
.nog{background:var(--gop);border-left:3px solid var(--go);color:#7B5F10;}
.ngg{background:var(--gp);border-left:3px solid var(--gl);color:var(--gd);}
.nbl{background:#E3F2FD;border-left:3px solid #1976D2;color:#1565C0;}
.nor{background:#FFF8E1;border-left:3px solid #F9A825;color:#6D4C00;}
.nrd{background:#FFEBEE;border-left:3px solid #C62828;color:#B71C1C;}

/* STEP BAR */
.stpb{display:flex;align-items:center;margin-bottom:10px;padding:0 4px;}
.stpi{display:flex;flex-direction:column;align-items:center;flex:1;}
.stpc{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;margin-bottom:3px;}
.done{background:var(--gm);color:var(--w);}
.actv{background:var(--go);color:var(--gd);}
.pend{background:var(--g200);color:var(--g400);}
.stpl{font-size:8px;color:var(--g600);text-align:center;line-height:1.2;}
.stpln{flex:1;height:1.5px;background:var(--g200);margin-top:-13px;}
.stpld{background:var(--gm);}

/* TABLE */
.mt{width:100%;border-collapse:collapse;font-size:10px;}
.mt th{background:var(--gd);color:var(--gol);padding:5px 8px;text-align:left;font-weight:700;}
.mt td{padding:5px 8px;border-bottom:1px solid var(--g200);vertical-align:middle;}
.mt tr:nth-child(even) td{background:var(--g50);}

/* SUMMARY */
.sr{display:flex;justify-content:space-between;padding:4px 0;font-size:10px;border-bottom:1px solid var(--g200);}
.srt{font-weight:700;color:var(--gd);border-top:2px solid var(--go);border-bottom:none;margin-top:2px;padding-top:5px;}

/* TABS */
.tabr{display:flex;border-bottom:2px solid var(--g200);margin-bottom:8px;}
.tabi{padding:5px 12px;font-size:10px;cursor:pointer;color:var(--g400);}
.tabi.act{color:var(--gd);font-weight:700;border-bottom:2px solid var(--go);margin-bottom:-2px;}

/* UPLOAD */
.upz{border:2px dashed var(--gl);border-radius:6px;padding:10px;text-align:center;background:var(--gp);font-size:9px;color:var(--gm);cursor:pointer;}

/* CALENDAR */
.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;}
.cdn{font-weight:700;color:var(--g400);padding:2px;font-size:8px;}
.cd{padding:3px;border-radius:3px;cursor:pointer;font-size:9px;}
.cd.tod{background:var(--gd);color:var(--w);font-weight:700;}
.cd.bkd{background:var(--gp);color:var(--gd);}
.cd.sel{background:var(--go);color:var(--gd);font-weight:700;}
.cd.oth{color:var(--g400);}
.cd.rest{background:#FFF3BF;color:#7B6010;border:1px solid #E0B52B;font-weight:700;}
.cd.closed{background:#E53935;color:#fff;cursor:not-allowed;text-decoration:line-through;font-weight:700;}
.ch{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px;font-weight:700;color:var(--gd);font-size:10px;}

/* STATS */
.sts{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:10px;}
.stb{background:var(--w);border:1px solid var(--g200);border-radius:7px;padding:8px 10px;text-align:center;border-top:3px solid var(--go);}
.stn{font-size:20px;font-weight:700;color:var(--gd);}
.stl{font-size:8px;color:var(--g400);}

/* CHART */
.cbr{display:flex;align-items:flex-end;gap:6px;height:70px;padding:0 4px;}
.cb{background:var(--gm);border-radius:3px 3px 0 0;flex:1;opacity:0.85;}
.cb.gld{background:var(--go);}
.clr{display:flex;gap:6px;padding:3px 4px 0;}
.cl{flex:1;text-align:center;font-size:8px;color:var(--g400);}

/* PAYMENT */
.pm{border:1px solid var(--g200);border-radius:6px;padding:8px 10px;display:flex;align-items:center;gap:8px;margin-bottom:6px;cursor:pointer;}
.pm.sel{border-color:var(--go);background:var(--gop);}
.pr{width:12px;height:12px;border-radius:50%;border:2px solid var(--g400);flex-shrink:0;}
.pr.sel{border-color:var(--go);background:var(--go);}
.pn{font-size:10px;font-weight:600;}
.pd{font-size:9px;color:var(--g400);}

/* FOOTER NAV */
.fn{display:flex;justify-content:flex-end;gap:8px;padding:8px 0 0;}

/* MODAL */
.mo{background:rgba(27,67,50,0.2);padding:16px;border-radius:var(--r);}
.mb{background:var(--w);border-radius:var(--r);padding:16px;border-top:4px solid var(--go);max-width:320px;margin:0 auto;box-shadow:0 8px 24px rgba(0,0,0,0.18);}
.mbt{font-size:12px;font-weight:700;color:var(--gd);margin-bottom:10px;}

/* NOTIF */
.nc{border-left:3px solid var(--gm);padding:7px 9px;margin-bottom:6px;background:var(--g50);border-radius:0 6px 6px 0;}
.nc.unr{border-color:var(--go);background:var(--gop);}
.nct{font-size:10px;font-weight:700;color:var(--gd);}
.ncb{font-size:9px;color:var(--g600);margin-top:2px;}
.nctm{font-size:8px;color:var(--g400);margin-top:3px;}

/* PROGRESS */
.pb{height:6px;background:var(--g200);border-radius:3px;overflow:hidden;margin-top:4px;}
.pf{height:100%;background:var(--gm);border-radius:3px;}




/* THAID */
.thaid-card{background:var(--gd);border-radius:10px;padding:16px;color:var(--w);text-align:center;margin:8px 0;}
.thaid-logo{font-size:24px;font-weight:700;color:var(--gol);letter-spacing:2px;}

/* QR */
.qr-box{width:130px;height:130px;border:3px solid var(--go);border-radius:8px;background:var(--w);margin:0 auto;display:flex;align-items:center;justify-content:center;position:relative;}
.qr-inner{width:110px;height:110px;background:repeating-conic-gradient(var(--gd) 0% 25%,var(--w) 0% 50%) 0 0 / 8px 8px;}

/* BARCODE */
.barcode{display:flex;gap:1px;align-items:flex-end;height:50px;justify-content:center;padding:4px;}
.barcode .bar{background:var(--gd);border-radius:1px;}

/* DETAIL IMG */
.det-img{width:100%;height:80px;background:linear-gradient(135deg,var(--gm),var(--gl));border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:28px;margin-bottom:8px;}

/* SUCCESS CIRCLE */
.succ{width:52px;height:52px;border-radius:50%;background:var(--gl);display:flex;align-items:center;justify-content:center;font-size:22px;color:var(--w);font-weight:700;margin:0 auto 8px;}

/* INFO ROW */
.inr{display:flex;gap:6px;margin-bottom:5px;font-size:9px;}
.inl{color:var(--g400);width:80px;flex-shrink:0;}
.inv{color:var(--td);font-weight:600;}

/* CHIP */
.chip{display:inline-flex;align-items:center;gap:4px;background:var(--gp);border:1px solid var(--gl);border-radius:4px;padding:2px 8px;font-size:9px;color:var(--gd);margin:2px;}

/* EXPORT */
.exp-opt{border:1px solid var(--g200);border-radius:6px;padding:8px 10px;margin-bottom:6px;display:flex;align-items:center;justify-content:space-between;cursor:pointer;}
.exp-opt.sel{border-color:var(--go);background:var(--gop);}

/* TIMELINE */
.tli{display:flex;gap:10px;margin-bottom:8px;}
.tldc{display:flex;flex-direction:column;align-items:center;}
.tld{width:14px;height:14px;border-radius:50%;flex-shrink:0;}
.tld.dn{background:var(--gm);}
.tld.av{background:var(--go);}
.tld.pd{background:var(--g200);}
.tll{width:2px;flex:1;background:var(--g200);margin:2px 0;min-height:16px;}
.tlld{background:var(--gl);}
.tlc{flex:1;padding-bottom:6px;}
.tls{font-size:10px;font-weight:700;color:var(--gd);}
.tls.pd{color:var(--g400);}
.tlt{font-size:8px;color:var(--g400);}

.login-wrap{padding:24px;background:var(--gp);min-height:300px;display:flex;align-items:center;justify-content:center;}
.login-box{background:var(--w);border-radius:10px;padding:20px 22px;width:220px;border-top:4px solid var(--go);box-shadow:var(--sh);}
.divider{border:none;border-top:1px solid var(--g200);margin:16px 0;}

</style>

</style>
